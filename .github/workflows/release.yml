name: Package or publish Vibink release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
      notes:
        description: Optional release notes; blank generates notes when publishing
        required: false
        type: string
      publish:
        description: Publish the ZIP and checksum as a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vibink-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Vibink
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      artifact_sha256: ${{ steps.artifact.outputs.sha256 }}
      commit: ${{ steps.provenance.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Validate release tag
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must use vX.Y.Z with numeric Chrome extension version components." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out existing tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag provenance
        id: provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "Checked-out HEAD does not match ${RELEASE_TAG}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "${RELEASE_TAG} does not point to a commit on origin/main." >&2
            exit 1
          fi
          echo "commit=${tag_commit}" >> "$GITHUB_OUTPUT"
          echo "Packaged commit: ${tag_commit}"

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked toolchain
        run: npm ci --ignore-scripts

      - name: Confirm tag and repository versions match
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (value !== process.env.RELEASE_VERSION) {
            console.error('Tag version does not match package.json:', process.env.RELEASE_VERSION, value);
            process.exit(1);
          }"

      - name: Run static checks
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Build and verify release package
        env:
          VIBINK_RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: node scripts/release.mjs "--version=${RELEASE_VERSION}" --no-publish

      - name: Record exact release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          zip_name="vibink-${RELEASE_VERSION}.zip"
          zip_path="releases/${zip_name}"
          checksum_path="${zip_path}.sha256"
          (
            cd releases
            sha256sum --check "${zip_name}.sha256"
          )
          artifact_sha256="$(sha256sum "$zip_path" | awk '{print $1}')"
          echo "name=vibink-${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${artifact_sha256}" >> "$GITHUB_OUTPUT"
          echo "Packaged ZIP SHA-256: ${artifact_sha256}"

      - name: Upload packaged extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          path: |
            releases/vibink-${{ steps.metadata.outputs.version }}.zip
            releases/vibink-${{ steps.metadata.outputs.version }}.zip.sha256

  publish:
    name: Publish Vibink GitHub Release
    if: ${{ inputs.publish }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out packaged commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.package.outputs.commit }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Download tested release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-artifact

      - name: Verify downloaded release artifact
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.artifact_sha256 }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          zip_name="vibink-${RELEASE_VERSION}.zip"
          zip_path="release-artifact/${zip_name}"
          checksum_path="${zip_path}.sha256"
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Package job did not provide a valid SHA-256 digest." >&2
            exit 1
          fi
          mapfile -t downloaded_files < <(find release-artifact -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_files=("${zip_name}" "${zip_name}.sha256")
          if [[ "${downloaded_files[*]}" != "${expected_files[*]}" ]]; then
            echo "Downloaded artifact does not contain exactly the expected ZIP and checksum." >&2
            exit 1
          fi
          if ! cmp -s "$checksum_path" <(printf '%s  %s\n' "$EXPECTED_SHA256" "$zip_name"); then
            echo "Downloaded checksum file does not match the package job digest." >&2
            exit 1
          fi
          actual_sha256="$(sha256sum "$zip_path" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Downloaded ZIP digest does not match the package job digest." >&2
            exit 1
          fi
          node scripts/verify-package.mjs "$zip_path" extension

      - name: Publish the exact packaged release
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ needs.package.outputs.commit }}
          EXPECTED_SHA256: ${{ needs.package.outputs.artifact_sha256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          git fetch --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$EXPECTED_COMMIT" || "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "${RELEASE_TAG} no longer points to packaged commit ${EXPECTED_COMMIT}." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" refs/remotes/origin/main; then
            echo "Packaged commit ${EXPECTED_COMMIT} is no longer on origin/main." >&2
            exit 1
          fi
          zip_name="vibink-${RELEASE_VERSION}.zip"
          zip_path="release-artifact/${zip_name}"
          checksum_path="${zip_path}.sha256"
          actual_sha256="$(sha256sum "$zip_path" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]] \
            || ! cmp -s "$checksum_path" <(printf '%s  %s\n' "$EXPECTED_SHA256" "$zip_name"); then
            echo "Release files changed after verification." >&2
            exit 1
          fi
          release_args=(
            release create "$RELEASE_TAG"
            "$zip_path"
            "$checksum_path"
            --verify-tag
            --title "Vibink ${RELEASE_TAG}"
          )
          if [[ -n "$RELEASE_NOTES" ]]; then
            release_args+=(--notes "$RELEASE_NOTES")
          else
            release_args+=(--generate-notes)
          fi
          gh "${release_args[@]}"
