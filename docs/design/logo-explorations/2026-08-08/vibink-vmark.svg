<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Vibink V-mark</title>
  <desc id="desc">A continuous white live stroke with a purple V inset on a purple rounded square.</desc>
  <defs>
    <linearGradient id="tile" x1="48" y1="34" x2="458" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9A7FF"/>
      <stop offset="0.42" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="ink" x1="102" y1="176" x2="438" y2="348" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1EDFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(146 100) rotate(47) scale(392)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#08040E" flood-opacity="0.36"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="32" y="24" width="448" height="448" rx="112" fill="url(#tile)"/>
    <rect x="32" y="24" width="448" height="448" rx="112" fill="url(#glow)"/>
    <rect x="33" y="25" width="446" height="446" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  </g>

  <path
    d="M92 315 166 225 228 337 302 176 371 298 421 247"
    fill="none"
    stroke="url(#ink)"
    stroke-width="46"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M178 246 228 337 291 199"
    fill="none"
    stroke="#5B21B6"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="443" cy="225" r="18" fill="#E3DDFF"/>
</svg>
